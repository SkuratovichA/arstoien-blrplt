# =============================================================================
# CI Workflow - Biome, Type Check, Test and Build
# =============================================================================
# Runs on all pull requests and pushes to main
# Must pass before merging

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Biome: formatting, lint rules and import order in one pass
  # ===========================================================================
  biome:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Run Biome
        run: pnpm run ci

  # ===========================================================================
  # Type Check
  # ===========================================================================
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # The server script generates the Prisma client first
      - name: Run TypeScript check
        run: pnpm typecheck

  # ===========================================================================
  # Tests
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # No spec talks to Postgres or Redis, so the job starts neither
      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

  # ===========================================================================
  # Build Check
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # GitHub sets CI=true, which makes the GraphQL codegen of the client and the admin read the committed schema.graphql instead of asking a running server
      - name: Build all packages
        run: pnpm build

  # ===========================================================================
  # All checks must pass
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [biome, typecheck, test, build]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "One or more CI jobs did not succeed: $RESULTS"
              exit 1
            fi
          done
          echo "All CI jobs passed!"
