name: Set up the workspace
description: Installs the pnpm version pinned in package.json, Node.js and the locked dependencies

runs:
  using: composite
  steps:
    # Without a version input the action reads the packageManager field of package.json, so the pinned pnpm is the only one
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
